ile picture <input id="profile-avatar-input" type="url" class="modal__input" name="avatar" placeholder="Paste the link to an image" required/> <span id="profile-avatar-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn modal__submit-btn_disabled modal__button_type_save modal__btn">Save</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container modal__container_type_delete"><button type="button" class="modal__avatar_close_button"></button><h2 class="modal__delete-title">Are you sure you want to delete this image?</h2><form class="modal__form modal__form_type_delete" id="delete-form"><div class="modal__btns"><button type="submit" class="modal__button_type_delete modal__btn">Delete</button> <button type="button" class="modal__submit-btn modal__submit-btn_disabled modal__button_type_cancel modal__btn">Cancel</button></div></form></div></div></body></html>
